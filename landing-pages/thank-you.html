<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Thank You | Info-Tech Research Group</title>

  <!-- Marketo Landing Page Variables -->
  <meta class="mktoString" id="pageTitle" mktoName="Page Title" default="Thank You">
  <meta class="mktoString" id="copyrightYear" mktoName="Copyright Year" default="2026">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    /* ==================== CSS Reset ==================== */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    html {
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 300;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    img {
      max-width: 100%;
      height: auto;
      border: 0;
    }

    a {
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    h1, h2, h3, h4, h5 {
      font-family: 'Montserrat', Helvetica, Arial, sans-serif;
      margin: 0;
      line-height: 1.2;
    }

    p {
      margin: 0;
    }

    /* ==================== Page Layout ==================== */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #0d3a5c 0%, #1a5a8a 50%, #2a7ab5 100%);
    }

    /* ==================== Header ==================== */
    .header {
      padding: 40px 24px 0;
      text-align: center;
    }

    .header__logo {
      height: 40px;
      width: auto;
    }

    /* ==================== Main Content ==================== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px 60px;
      text-align: center;
    }

    .hero__icon {
      margin-bottom: 40px;
    }

    .hero__icon img {
      width: 180px;
      height: auto;
    }

    .hero__headline {
      font-size: 56px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 24px;
      letter-spacing: -0.02em;
    }

    .hero__message {
      font-size: 20px;
      font-weight: 300;
      line-height: 1.6;
      color: #7eb8e2;
      max-width: 540px;
      margin: 0 auto;
    }

    /* ==================== Footer ==================== */
    .footer {
      background-color: #ffffff;
      border-radius: 24px 24px 0 0;
      padding: 32px 40px;
      margin: 0 16px;
    }

    .footer__inner {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    @media screen and (min-width: 768px) {
      .footer__inner {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        gap: 32px;
      }
    }

    .footer__brand {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .footer__logo {
      height: 32px;
      width: auto;
    }

    .footer__divider {
      width: 1px;
      height: 40px;
      background-color: #d1d5db;
      display: none;
    }

    @media screen and (min-width: 768px) {
      .footer__divider {
        display: block;
      }
    }

    .footer__logo--sr {
      height: 48px;
      width: auto;
    }

    .footer__copyright {
      font-size: 13px;
      font-weight: 400;
      line-height: 1.5;
      color: #6b7280;
      text-align: center;
    }

    @media screen and (min-width: 768px) {
      .footer__copyright {
        text-align: right;
      }
    }

    .footer__copyright a {
      color: #6b7280;
      text-decoration: underline;
    }

    .footer__copyright a:hover {
      color: #374151;
    }

    /* ==================== Responsive ==================== */
    @media screen and (max-width: 640px) {
      .header {
        padding: 32px 20px 0;
      }

      .header__logo {
        height: 32px;
      }

      .main {
        padding: 32px 20px 48px;
      }

      .hero__icon {
        margin-bottom: 32px;
      }

      .hero__icon img {
        width: 140px;
      }

      .hero__headline {
        font-size: 40px;
        margin-bottom: 20px;
      }

      .hero__message {
        font-size: 17px;
      }

      .footer {
        margin: 0 12px;
        padding: 24px 20px;
        border-radius: 20px 20px 0 0;
      }

      .footer__brand {
        flex-direction: column;
        gap: 16px;
      }

      .footer__logo {
        height: 28px;
      }

      .footer__logo--sr {
        height: 40px;
      }

      .footer__copyright {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <!-- Header -->
    <header class="header">
      <a href="https://www.infotech.com/?utm_source=marketo&utm_medium=landing-page" target="_blank" rel="noopener">
        <img
          src="https://info.softwarereviews.com/rs/353-GFN-093/images/ITRG-logo-white.svg"
          alt="Info-Tech Research Group"
          class="header__logo"
          id="headerLogo"
        >
      </a>
    </header>

    <!-- Main Content -->
    <main class="main">
      <div class="hero__icon">
        <div id="heroIcon" class="mktoImg" mktoName="Hero Icon">
          <img
            src="https://info.softwarereviews.com/rs/353-GFN-093/images/checkmark-3d.png"
            alt=""
            aria-hidden="true"
          >
        </div>
      </div>

      <h1 class="hero__headline">
        <div id="headline" class="mktoText" mktoName="Headline">
          We Got You.
        </div>
      </h1>

      <div class="hero__message">
        <div id="heroMessage" class="mktoText" mktoName="Message">
          Thanks for your interest. Your request's in the queue and a member of our team will reach out soon.
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer__inner">
        <div class="footer__brand">
          <a href="https://www.infotech.com/?utm_source=marketo&utm_medium=landing-page" target="_blank" rel="noopener">
            <img
              src="https://info.softwarereviews.com/rs/353-GFN-093/images/ITRG-official-logo.svg"
              alt="Info-Tech Research Group"
              class="footer__logo"
            >
          </a>
          <div class="footer__divider"></div>
          <a href="https://www.softwarereviews.com/?utm_source=marketo&utm_medium=landing-page" target="_blank" rel="noopener">
            <img
              src="https://info.softwarereviews.com/rs/353-GFN-093/images/SR-offical-logo.png"
              alt="SoftwareReviews"
              class="footer__logo--sr"
            >
          </a>
        </div>

        <div class="footer__copyright">
          <div id="footerCopyright" class="mktoText" mktoName="Footer Copyright">
            &copy; 1997 - ${copyrightYear} SoftwareReviews. SoftwareReviews is a division of<br>
            Info-Tech Research Group Inc. All rights reserved.
          </div>
        </div>
      </div>
    </footer>

  </div>
</body>
</html>
