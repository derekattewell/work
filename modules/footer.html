<!--
    Marketo Module: Footer
    Usage: Copy this module into your email template's <table> structure
    Variables Required: ${fontFamily}, ${showFooterSocial}
-->

<!-- Full Footer with Social -->
<tr class="mktoModule" id="footerFullModule" mktoName="Footer - Full">
    <td style="padding: 30px; background-color: #f8f8f8; font-family: ${fontFamily}; font-size: 12px; line-height: 1.5; color: #999999; text-align: center;">
        <!-- Social Icons -->
        <div style="display: ${showFooterSocial}; margin-bottom: 20px;">
            <a href="https://facebook.com" style="display: inline-block; margin: 0 5px;">
                <img src="https://via.placeholder.com/32x32?text=FB" alt="Facebook" width="32" height="32">
            </a>
            <a href="https://twitter.com" style="display: inline-block; margin: 0 5px;">
                <img src="https://via.placeholder.com/32x32?text=TW" alt="Twitter" width="32" height="32">
            </a>
            <a href="https://linkedin.com" style="display: inline-block; margin: 0 5px;">
                <img src="https://via.placeholder.com/32x32?text=LI" alt="LinkedIn" width="32" height="32">
            </a>
            <a href="https://instagram.com" style="display: inline-block; margin: 0 5px;">
                <img src="https://via.placeholder.com/32x32?text=IG" alt="Instagram" width="32" height="32">
            </a>
        </div>

        <div class="mktoText" id="footerAddress" mktoName="Company Address">
            <p style="margin: 0 0 10px 0;">
                {{system.company}}<br>
                {{system.address}}
            </p>
        </div>

        <div class="mktoText" id="footerLinks" mktoName="Footer Links">
            <p style="margin: 0 0 10px 0;">
                <a href="{{system.viewAsWebpageLink}}" style="color: #999999;">View in browser</a> |
                <a href="{{system.unsubscribeLink}}" style="color: #999999;">Unsubscribe</a> |
                <a href="{{system.forwardToFriendLink}}" style="color: #999999;">Forward to a friend</a>
            </p>
        </div>

        <div class="mktoText" id="footerCopyright" mktoName="Copyright">
            <p style="margin: 0;">
                &copy; {{system.currentYear}} Your Company. All rights reserved.
            </p>
        </div>
    </td>
</tr>

<!-- Minimal Footer -->
<tr class="mktoModule" id="footerMinimalModule" mktoName="Footer - Minimal">
    <td style="padding: 20px 30px; background-color: #ffffff; border-top: 1px solid #eeeeee; font-family: ${fontFamily}; font-size: 11px; line-height: 1.5; color: #999999; text-align: center;">
        <div class="mktoText" id="footerMinimalContent" mktoName="Footer Content">
            <p style="margin: 0;">
                {{system.company}} | {{system.address}}<br>
                <a href="{{system.unsubscribeLink}}" style="color: #999999;">Unsubscribe</a>
            </p>
        </div>
    </td>
</tr>

<!-- Dark Footer -->
<tr class="mktoModule" id="footerDarkModule" mktoName="Footer - Dark">
    <td style="padding: 40px 30px; background-color: #222222; font-family: ${fontFamily}; font-size: 12px; line-height: 1.6; color: #aaaaaa; text-align: center;">
        <!-- Social Icons -->
        <div style="margin-bottom: 25px;">
            <a href="https://facebook.com" style="display: inline-block; margin: 0 8px;">
                <img src="https://via.placeholder.com/36x36/ffffff/222222?text=FB" alt="Facebook" width="36" height="36">
            </a>
            <a href="https://twitter.com" style="display: inline-block; margin: 0 8px;">
                <img src="https://via.placeholder.com/36x36/ffffff/222222?text=TW" alt="Twitter" width="36" height="36">
            </a>
            <a href="https://linkedin.com" style="display: inline-block; margin: 0 8px;">
                <img src="https://via.placeholder.com/36x36/ffffff/222222?text=LI" alt="LinkedIn" width="36" height="36">
            </a>
        </div>

        <div class="mktoText" id="footerDarkContent" mktoName="Footer Content">
            <p style="margin: 0 0 15px 0; color: #ffffff;">
                {{system.company}}
            </p>
            <p style="margin: 0 0 15px 0;">
                {{system.address}}
            </p>
            <p style="margin: 0;">
                <a href="{{system.viewAsWebpageLink}}" style="color: #aaaaaa;">View in browser</a> &nbsp;|&nbsp;
                <a href="{{system.unsubscribeLink}}" style="color: #aaaaaa;">Unsubscribe</a> &nbsp;|&nbsp;
                <a href="{{system.forwardToFriendLink}}" style="color: #aaaaaa;">Forward</a>
            </p>
        </div>
    </td>
</tr>
